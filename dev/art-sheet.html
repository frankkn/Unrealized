<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNREALIZED — 場景圖總覽（dev）</title>
<!--
  dev-only：把 art/ 底下的 45 張場景圖依章節排在一起，一次看完。
  直接用瀏覽器打開這個檔案即可，不需要伺服器或安裝任何東西。
  重生某幾張之後重新整理就好 —— 這是判斷「哪張生壞了、哪張風格漂了」最快的方式。
-->
<style>
  :root {
    --ink: #1c2b4a; --ink-soft: #33456b;
    --paper: #f2e8cf; --gold: #b8891f; --stamp: #b23a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.5rem 4rem;
    background: var(--ink); color: var(--paper);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  header { max-width: 72rem; margin: 0 auto 1.6rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; letter-spacing: .05em; }
  .meta { color: var(--gold); font-size: .85rem; margin: 0; }
  .warn { color: var(--stamp); font-weight: 700; }
  .controls { margin-top: 1rem; display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; font-size: .85rem; }
  .controls label { display: flex; gap: .4rem; align-items: center; cursor: pointer; }

  .sheet { max-width: 72rem; margin: 0 auto; display: grid; gap: 1.1rem;
           grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
  .sheet.big { grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr)); }
  figure { margin: 0; background: #10131c; border: 1px solid var(--ink-soft); border-radius: 3px; overflow: hidden; position: relative; }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 3/4; object-fit: cover; background: #000; }
  figure.missing { outline: 2px solid var(--stamp); }
  .ph { aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; color: var(--stamp); font-size: .8rem; }
  figcaption { padding: .45rem .55rem .6rem; font-family: ui-monospace, Menlo, monospace; font-size: .66rem; color: #8892a8; word-break: break-all; }
  figcaption b { display: block; font-family: inherit; font-size: .8rem; color: var(--paper); font-weight: 700; margin-bottom: .1rem; }
  .ch { grid-column: 1 / -1; margin: 1rem 0 -.3rem; font-size: .95rem; color: var(--gold);
        border-bottom: 1px solid var(--ink-soft); padding-bottom: .3rem; }

  /* 底部留白是最常見的生壞方式。疊一層漸層模擬遊戲裡文字壓上去的位置，
     用來檢查重點有沒有掉進會被蓋掉的那三分之一。 */
  .sheet.overlay figure::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 1.9rem; height: 33%;
    background: linear-gradient(to top, rgba(242,232,207,.92), rgba(242,232,207,0));
    pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>UNREALIZED — 場景圖總覽</h1>
  <p class="meta" id="meta">載入中…</p>
  <div class="controls">
    <label><input type="checkbox" id="big"> 放大</label>
    <label><input type="checkbox" id="overlay"> 模擬文字區（檢查底部三分之一會不會蓋掉重點）</label>
  </div>
</header>
<div class="sheet" id="sheet"></div>

<script src="../data/config.js"></script>
<script src="../data/nodes-ch0-3.js"></script>
<script src="../data/nodes-ch4-5.js"></script>
<script src="../data/nodes-ch6-7.js"></script>
<script>
(function () {
  var nodes = window.UNREALIZED.nodes;
  var sheet = document.getElementById('sheet');
  var order = Object.keys(nodes).sort(function (a, b) {
    return nodes[a].chapter - nodes[b].chapter || a.localeCompare(b);
  });

  var html = '', lastCh = -1;
  order.forEach(function (id) {
    var node = nodes[id];
    if (node.chapter !== lastCh) {
      lastCh = node.chapter;
      html += '<h2 class="ch">第 ' + lastCh + ' 章</h2>';
    }
    html += '<figure data-node="' + id + '">' +
      '<img src="../art/' + id + '.webp" alt="">' +
      '<figcaption><b>' + node.title + '</b>' + id + '</figcaption></figure>';
  });
  sheet.innerHTML = html;

  // 缺圖要看得出來：img 載不到就換成佔位，否則只會看到一個破圖 icon
  var missing = 0;
  sheet.querySelectorAll('figure img').forEach(function (img) {
    img.addEventListener('error', function () {
      missing++;
      var fig = img.parentNode;
      fig.classList.add('missing');
      img.remove();
      fig.insertAdjacentHTML('afterbegin', '<div class="ph">缺圖</div>');
      report();
    });
  });

  function report() {
    document.getElementById('meta').innerHTML =
      order.length + ' 個節點 · ' +
      (missing ? '<span class="warn">缺 ' + missing + ' 張</span>' : '全部齊備');
  }
  report();

  document.getElementById('big').addEventListener('change', function (e) {
    sheet.classList.toggle('big', e.target.checked);
  });
  document.getElementById('overlay').addEventListener('change', function (e) {
    sheet.classList.toggle('overlay', e.target.checked);
  });
})();
</script>
</body>
</html>
